[project]
name = "linkedin-lora"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # --- pinned: florence/flux pipeline requires these exact versions ---
    "transformers==4.51.3",
    "tokenizers==0.21.4",
    "huggingface-hub==0.36.2",

    # --- torch (installed from pytorch index below) ---
    "torch>=2.3.0",
    "torchvision>=0.18.0",

    # --- diffusion / HF ecosystem ---
    "diffusers>=0.29.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.3",

    # --- quantisation ---
    "bitsandbytes>=0.43.0",

    # --- data / image processing ---
    "Pillow>=10.3.0",
    "numpy>=1.26.0",

    # --- tokenizer backends ---
    "sentencepiece>=0.2.0",
    "protobuf>=5.26.0",

    # --- training utilities ---
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
