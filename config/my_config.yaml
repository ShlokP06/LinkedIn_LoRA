model:
  name_or_path: "black-forest-labs/FLUX.1-dev"
  quantize_base: true
  dtype: bfloat16

data:
  images_dir: "data/dataset/images"
  captions_dir: "data/dataset/captions"
  cache_dir: "data/cache"
  trigger: "Shl0k"
  captions_dropout: 0.05

lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"
    - "add_q_proj"
    - "add_k_proj"
    - "add_v_proj"

train:
  steps: 2000
  batch_size: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  grad_clip_norm: 1.0
  seed: 42

  optimizer: "adamw8bit"
  lr: 1.0e-4
  weight-decay: 1.0e-4
  warmup_steps: 100

  ema:
    enabled: true
    decay: 0.99

  noise:
    scheduler: "flowmatch"
    timestep_sampling: "logit_normal"
    guidance_scale: 1.0

save:
  output_dir: "checkpoints"
  save_every: 250
  max_checkpoints: 6
  dtype: "float16"

sample:
  enabled: true
  sample_every: 250
  width: 1024
  height: 1024
  steps: 30
  guidance_scale: 4.0
  seed: 42
  walk_seed: true
  prompts:
    - 
    - 
    -
    -
    -

