model:
  name: "black-forest-labs/FLUX.1-dev"
  quantize_base: true
  dtype: bfloat16

data:
  images_dir: "data/v3/images"
  captions_dir: "data/v3/captions_groq"
  cache_dir: "data/cache"
  trigger: "Shl0k"
  caption_dropout: 0.1

lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"
    - "proj_mlp"
    - "proj_out"

train:
  steps: 3000
  batch_size: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  grad_clip_norm: 1.0
  seed: 42

  optimizer: "adamw8bit"
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 100

  ema:
    enabled: true
    decay: 0.99

  noise:
    scheduler: "flowmatch"
    timestep_sampling: "logit_normal"
    guidance_scale: 1.0
    offset: 0.05

save:
  output_dir: "checkpoints"
  save_every: 250
  max_checkpoints: 6
  dtype: "float16"

sample:
  enabled: true
  sample_every: 50
  width: 768
  height: 768
  steps: 40
  guidance_scale: 4.0
  seed: 42
  walk_seed: true
  prompts:
    - "LinkedIn Profile picture of Shl0k wearing a charcoal grey suit and white dress shirt, standing straight with hands clasped in front, looking directly at the camera with a confident expression, soft studio lighting against a plain white background"
    - "LinkedIn Profile picture of Shl0k in a navy blue blazer over a light blue Oxford shirt, seated at a modern desk with a laptop open, leaning slightly forward with a relaxed smile, warm indoor office lighting"
    - "LinkedIn Profile picture of Shl0k wearing a cream kurta with subtle embroidery, standing on an outdoor terrace at golden hour, hands in pockets, gazing slightly off-camera with a calm expression, soft warm evening light"
    - "LinkedIn Profile picture of Shl0k in a black turtleneck and dark jeans, standing on a conference stage with a large projection screen behind him, right hand raised mid-gesture, looking at the camera under bright stage lighting"
    - "LinkedIn Profile picture of Shl0k wearing a white polo shirt, standing against a brick wall in natural daylight, arms relaxed at his sides, smiling at the camera, casual urban outdoor setting"
    - "LinkedIn Profile picture of Shl0k wearing a navy blue hoodie, sitting on a rocky shoreline at a beach with waves crashing behind him, grinning broadly at the camera, bright natural coastal light"
    - "LinkedIn Profile picture of Shl0k in a dark olive jacket over a black turtleneck, standing on an observation deck with the Empire State Building and the Manhattan skyline visible behind him, looking off to the side with a serious expression, overcast daylight"

